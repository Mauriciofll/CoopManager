<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00733a">
  <title>CoopManager Mobile</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CoopManager</p>
        <h1 id="screenTitle">Resumo</h1>
      </div>
      <button class="icon-button" id="themeButton" type="button" aria-label="Alternar tema">◐</button>
    </header>

    <section class="profile-strip" aria-label="Perfil de operação"></section>

    <main id="app" class="content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button class="nav-item is-active" data-view="summary" type="button">Resumo</button>
      <button class="nav-item" data-view="orders" type="button">Pedidos</button>
      <button class="nav-item" data-view="products" type="button">Produtos</button>
      <button class="nav-item" data-view="lists" type="button">Listas</button>
    </nav>
  </div>

  <template id="emptyStateTemplate">
    <div class="empty-state">
      <strong>Nada para mostrar agora.</strong>
      <span>Quando houver movimentação, ela aparece aqui.</span>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
